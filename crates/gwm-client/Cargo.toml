[package]
name = "gwm-client"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "Reads gwm's machine contract for gwm-gpui. No GPUI dependency, so its tests build in seconds."
repository = "https://github.com/kbrdn1/gwm-gpui"
publish = false

[dependencies]
# `getuid`, to tell an owner-only socket directory from a shared one, as gwm does.
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tempfile = "3"
