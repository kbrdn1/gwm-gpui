name: ci

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# `rustup toolchain install` reads rust-toolchain.toml, the one place the version
# and its components are declared.
jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - run: rustup toolchain install
      - run: cargo fmt --all -- --check

  # macOS only for now: it's the only platform the manifest enables.
  clippy:
    name: clippy
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings

  test:
    name: test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      # gwm-client's tests drive a real `gwm daemon` and fail without it. Pinned,
      # and checked against the release's checksum: bump it in its own PR.
      - name: install gwm
        env:
          GWM_VERSION: 1.11.0
        run: |
          archive="gwm-v${GWM_VERSION}-aarch64-apple-darwin"
          base="https://github.com/kbrdn1/gwm-cli/releases/download/v${GWM_VERSION}"
          curl -fsSLO "$base/$archive.tar.gz"
          curl -fsSLO "$base/$archive.tar.gz.sha256"
          echo "$(cut -d' ' -f1 "$archive.tar.gz.sha256")  $archive.tar.gz" | shasum -a 256 -c
          tar -xzf "$archive.tar.gz"
          mkdir -p "$HOME/.local/bin"
          install -m 755 "$archive/gwm" "$HOME/.local/bin/gwm"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - run: gwm --version
      - run: cargo test --locked --workspace

  audit:
    name: cargo audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: cargo install cargo-audit --locked
      # `--deny warnings` also fails on unmaintained, unsound and yanked crates.
      - run: cargo audit --deny warnings
