name: "✨ Feature Request"
description: "Suggest a new feature or enhancement"
title: "[Feature]: "
labels: ["feature"]
assignees: []

body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What pain point are you trying to solve?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: How should the app behave instead?
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
    validations:
      required: false

  - type: dropdown
    id: surface
    attributes:
      label: Surface
      options:
        - ui (views, rendering, theme)
        - gwm-contract (reading or driving gwm)
        - packaging / install
        - docs
        - other
    validations:
      required: true

  - type: dropdown
    id: needs_gwm
    attributes:
      label: Does this need a change in gwm itself?
      description: The app only drives gwm. Worktree logic goes in gwm-cli.
      options:
        - "No"
        - "Yes"
        - Not sure
    validations:
      required: true

  - type: textarea
    id: notes
    attributes:
      label: Additional context
    validations:
      required: false
